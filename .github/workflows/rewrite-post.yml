name: Reescrever artigo selecionado

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug exato do artigo que será reescrito'
        required: true
        type: string
      replacement_file:
        description: 'Caminho do texto revisado no repositório'
        required: true
        type: string
        default: 'content/rewrites/quando-o-espelho-das-redes-sociais-distorce-quem-voce-e.txt'

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite selected article
        env:
          POST_SLUG: ${{ inputs.slug }}
          REPLACEMENT_FILE: ${{ inputs.replacement_file }}
        run: node scripts/rewrite-post.mjs

      - name: Generate RSS feed
        run: node scripts/generate-rss.mjs

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo 'Nenhuma alteração para enviar.'
          else
            git commit -m "fix(post): reescreve artigo selecionado em português"
            git push
          fi
