name: Auto Post - Generate Articles and RSS

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '30 15 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema do artigo (vazio usa rotação automática)'
        required: false
        type: string
        default: ''
      count:
        description: 'Número de artigos'
        required: false
        type: number
        default: 1
      lang:
        description: 'Idioma'
        required: false
        type: choice
        options:
          - pt
        default: pt

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate posts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          TEMA_INPUT: ${{ inputs.topic || '' }}
          COUNT: ${{ inputs.count || 1 }}
          LANG: pt
        run: node scripts/generate-post.mjs

      - name: Generate RSS feed
        run: node scripts/generate-rss.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma alteração para enviar."
          else
            git commit -m "Auto: novo artigo em português e RSS atualizado"
            git push
          fi
