name: Auto Post - Generate Articles and RSS

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '30 15 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the article (deixe vazio para rotação automática)'
        required: false
        type: string
        default: ''
      count:
        description: 'Number of articles to generate'
        required: false
        type: number
        default: 1
      lang:
        description: 'Language (en or pt)'
        required: false
        type: string
        default: 'pt'

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate posts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          TEMA_INPUT: ${{ github.event.inputs.topic }}
          COUNT: ${{ github.event.inputs.count }}
          LANG: ${{ github.event.inputs.lang }}
        run: node scripts/generate-post.mjs

      - name: Generate RSS feed
        run: node scripts/generate-rss.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/posts.ts public/rss.xml
          git diff --staged --quiet || git commit -m "Auto: new posts and RSS feed for topic: ${{ github.event.inputs.topic || 'rotação automática' }}"
          git push
