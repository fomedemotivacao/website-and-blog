name: Generate RSS Feed

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/data/posts.ts'
    branches:
      - main

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate RSS feed
        run: node scripts/generate-rss.mjs

      - name: Commit and push RSS
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/rss.xml
          git diff --staged --quiet || git commit -m "Auto: regenerate RSS feed"
          git push
